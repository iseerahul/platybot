<!DOCTYPE html>
<html>
<head>
    <title>Platy AI Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #bbd0e3;
            --secondary-color: #1a1a2e;
            --accent-color: #4e00ff;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --sidebar-width: 300px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: #0f0f1a;
            color: var(--text-primary);
            display: grid;
            grid-template-columns: var(--sidebar-width) 1fr;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar Styles */
        .sidebar {
            background: var(--secondary-color);
            padding: 1.5rem;
            border-right: 1px solid #2a2a4a;
            display: flex;
            flex-direction: column;
        }

        .new-chat {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9rem;
        }

        .new-chat:hover {
            background: #5c1aff;
        }

        .history {
            margin-top: 2rem;
            flex: 1;
            overflow-y: auto;
        }

        .chat-history-item {
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
        }

        .chat-history-item:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Main Chat Area */
        .main {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .chat-header {
            padding: 1rem 2rem;
            background: rgba(29, 26, 46, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #2a2a4a;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        #chatbox {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            scroll-behavior: smooth;
        }

        .msg {
            max-width: 80%;
            margin: 1.5rem 0;
            padding: 1rem;
            border-radius: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            background: var(--accent-color);
            margin-left: auto;
            border-radius: 12px 12px 0 12px;
        }

        .bot {
            background: var(--secondary-color);
            margin-right: auto;
            border-radius: 12px 12px 12px 0;
        }

        #inputBar {
            padding: 1.5rem 2rem;
            background: rgba(26, 26, 46, 0.8);
            backdrop-filter: blur(10px);
            border-top: 1px solid #2a2a4a;
        }

        .input-container {
            display: flex;
            gap: 1rem;
            background: var(--secondary-color);
            padding: 0.5rem;
            border-radius: 12px;
            border: 1px solid #2a2a4a;
        }

        #userInput {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            padding: 0.5rem;
            font-size: 1rem;
            outline: none;
        }

        .send-btn {
            background: var(--primary-color);
            color: var(--secondary-color);
            border: none;
            padding: 0.5rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .send-btn:hover {
            background: #00d8df;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #2a2a4a;
            border-radius: 3px;
        }

        /* Markdown Styling */
        .bot pre {
            background: #1a1a2e;
            padding: 1rem;
            border-radius: 8px;
            overflow-x: auto;
        }

        .bot code {
            font-family: 'Fira Code', monospace;
            color: #00f7ff;
        }

        .bot a {
            color: var(--primary-color);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <button class="new-chat">
            <i class="ri-add-line"></i>
            New Chat
        </button>
        <div class="history" id="chatHistory">
            <!-- Chat history items will be added here -->
        </div>
    </aside>

    <main class="main">
        <div class="chat-header">
            <h2>Chat with Platy AI</h2>
            <div class="actions">
                <i class="ri-delete-bin-line" onclick="clearChat()" style="cursor: pointer;"></i>
            </div>
        </div>

        <div id="chatbox"></div>

        <div id="inputBar">
            <div class="input-container">
                <input type="text" id="userInput" placeholder="Ask anything..." onkeydown="handleKey(event)">
                <button class="send-btn" onclick="sendMessage()">
                    <i class="ri-send-plane-fill"></i>
                    Send
                </button>
            </div>
        </div>
    </main>

    <script>
        let chatHistory = [];

        async function sendMessage() {
            const input = document.getElementById("userInput");
            const text = input.value.trim();
            if (!text) return;

            addMessage("You", text, "user");
            input.value = "";

            // Save to chat history
            if (!chatHistory.find(chat => chat.message === text)) {
                chatHistory.unshift({
                    message: text,
                    timestamp: new Date().toISOString()
                });
                updateChatHistory();
            }

            const res = await fetch("/chat", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({message: text})
            });

            const data = await res.json();
            addMessage("Platy", data.reply, "bot");
        }

        function addMessage(sender, msg, className) {
            const div = document.createElement("div");
            div.className = "msg " + className;
            div.innerHTML = `<strong>${sender}:</strong> ${msg}`;
            document.getElementById("chatbox").appendChild(div);
            document.getElementById("chatbox").scrollTop = document.getElementById("chatbox").scrollHeight;
        }

        function updateChatHistory() {
            const history = document.getElementById("chatHistory");
            history.innerHTML = chatHistory.map(chat => `
                <div class="chat-history-item" onclick="loadChat('${chat.message}')">
                    <i class="ri-message-3-line"></i>
                    ${chat.message.substring(0, 30)}${chat.message.length > 30 ? '...' : ''}
                </div>
            `).join('');
        }

        function loadChat(message) {
            document.getElementById("userInput").value = message;
        }

        function clearChat() {
            document.getElementById("chatbox").innerHTML = "";
            chatHistory = [];
            updateChatHistory();
        }

        function handleKey(e) {
            if (e.key === "Enter") {
                e.preventDefault();
                sendMessage();
            }
        }
    </script>
</body>
</html>
